apiVersion: apps/v1
kind: Deployment
metadata:
  name: amaterky-scraper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: amaterky-scraper
      component: web
  template:
    metadata:
      labels:
        app: amaterky-scraper
        component: web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:stable-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: amaterky-scraper-nginx
        - name: data
          persistentVolumeClaim:
            claimName: amaterky-scraper-data
