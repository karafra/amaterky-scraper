apiVersion: v1
kind: Service
metadata:
  name: {{ include "amaterky.name" . }}
  labels:
    {{- include "amaterky.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
  selector:
    {{- include "amaterky.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
