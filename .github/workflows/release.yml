name: Release

on:
  workflow_dispatch:

concurrency:
  group: release-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: validate
    uses: ./.github/workflows/publish-release.yml
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write

  pages:
    needs: publish
    uses: ./.github/workflows/publish-pages.yml
    with:
      tag: ${{ needs.publish.outputs.tag }}
    permissions:
      contents: write
      pages: write
      id-token: write
